<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">La Mesasa</title>
  <desc id="d">Tronco de pino horizontal con el nombre LA MESASA tallado</desc>
  <defs>
    <linearGradient id="bark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6b3d"/>
      <stop offset=".25" stop-color="#7f542d"/>
      <stop offset=".7" stop-color="#5f3c20"/>
      <stop offset="1" stop-color="#3f2713"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6b972"/>
      <stop offset="1" stop-color="#cf9a55"/>
    </linearGradient>
    <linearGradient id="panelShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1d08" stop-opacity=".5"/>
      <stop offset=".22" stop-color="#3a1d08" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="face" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#f2cf92"/>
      <stop offset="1" stop-color="#d9a45f"/>
    </radialGradient>
    <clipPath id="body"><path d="M70,50 H570 V210 H70 A24,80 0 0 1 70,50 Z"/></clipPath>
    <clipPath id="lbox"><rect width="36" height="44"/></clipPath>

    <!-- Letras: L A _ M E S A S A (36 x 44 cada una) -->
    <g id="txt" fill="none" stroke-width="7" stroke-linejoin="round">
      <path d="M3.5,0 V40.5 H36"/>
      <g transform="translate(46,0)"><g clip-path="url(#lbox)"><path d="M2,48 L13,3.5 H23 L34,48 M8,29 H28"/></g></g>
      <path transform="translate(110,0)" d="M3.5,44 V3.5 L18,28 L32.5,3.5 V44"/>
      <path transform="translate(156,0)" d="M36,3.5 H3.5 V40.5 H36 M3.5,22 H32"/>
      <path transform="translate(202,0)" d="M31,11 C30,5 24,3.5 18,3.5 C11,3.5 5.5,6.5 5.5,12 C5.5,18 12,20 18,22 C25,24 31,26 31,32 C31,37.5 25,40.5 18,40.5 C11,40.5 5,38 4,31"/>
      <g transform="translate(248,0)"><g clip-path="url(#lbox)"><path d="M2,48 L13,3.5 H23 L34,48 M8,29 H28"/></g></g>
      <path transform="translate(294,0)" d="M31,11 C30,5 24,3.5 18,3.5 C11,3.5 5.5,6.5 5.5,12 C5.5,18 12,20 18,22 C25,24 31,26 31,32 C31,37.5 25,40.5 18,40.5 C11,40.5 5,38 4,31"/>
      <g transform="translate(340,0)"><g clip-path="url(#lbox)"><path d="M2,48 L13,3.5 H23 L34,48 M8,29 H28"/></g></g>
    </g>
  </defs>

  <!-- Cuerpo del tronco -->
  <path d="M70,50 H570 V210 H70 A24,80 0 0 1 70,50 Z" fill="url(#bark)"/>

  <!-- Textura de corteza -->
  <g clip-path="url(#body)" fill="none" stroke="#35200f" stroke-linecap="round">
    <path d="M40,62 C140,56 230,70 330,62 S500,68 600,60" stroke-width="2.4" opacity=".5"/>
    <path d="M40,76 C120,82 210,72 310,80 S470,74 600,80" stroke-width="2" opacity=".4"/>
    <path d="M40,184 C130,178 220,190 330,182 S490,188 600,180" stroke-width="2.4" opacity=".5"/>
    <path d="M40,198 C120,204 230,194 340,202 S480,196 600,202" stroke-width="2" opacity=".45"/>
    <path d="M60,70 l26,0 M170,66 l34,0 M290,72 l22,0 M410,64 l30,0 M500,76 l26,0" stroke-width="3" opacity=".35"/>
    <path d="M80,190 l30,0 M200,186 l24,0 M330,194 l36,0 M450,188 l28,0" stroke-width="3" opacity=".4"/>
    <path d="M60,56 H560" stroke="#d0a06a" stroke-width="3" opacity=".45"/>
  </g>

  <!-- Nudos -->
  <g>
    <ellipse cx="392" cy="68" rx="10" ry="6.5" fill="#3a2211"/>
    <ellipse cx="392" cy="68" rx="5.5" ry="3.4" fill="#5c3a1c"/>
    <ellipse cx="226" cy="193" rx="9" ry="5.6" fill="#2f1b0c"/>
    <ellipse cx="226" cy="193" rx="4.8" ry="2.9" fill="#52321a"/>
  </g>

  <!-- Contorno izquierdo -->
  <path d="M70,50 A24,80 0 0 0 70,210" fill="none" stroke="#2f1b0c" stroke-width="2" opacity=".6"/>

  <!-- Cara cortada (anillos de crecimiento) -->
  <ellipse cx="570" cy="130" rx="24" ry="80" fill="#5b3a1c"/>
  <ellipse cx="570" cy="130" rx="19.5" ry="75" fill="url(#face)"/>
  <g fill="none" stroke="#b57d3c" stroke-width="1.6" opacity=".85">
    <ellipse cx="570" cy="130" rx="16.5" ry="63.8"/>
    <ellipse cx="570" cy="130" rx="13.3" ry="51"/>
    <ellipse cx="570" cy="130" rx="10.1" ry="39"/>
    <ellipse cx="570" cy="130" rx="7.2" ry="27.8"/>
    <ellipse cx="570" cy="130" rx="4.5" ry="17.2"/>
  </g>
  <ellipse cx="570" cy="130" rx="1.8" ry="6.5" fill="#8a5a2a"/>

  <!-- Placa tallada -->
  <rect x="100" y="90" width="430" height="80" rx="12" fill="url(#panel)" stroke="#6b3f1c" stroke-width="3"/>
  <rect x="100" y="90" width="430" height="80" rx="12" fill="url(#panelShadow)"/>

  <!-- Nombre tallado -->
  <use href="#txt" transform="translate(129,110.5)" stroke="#f3d9a6" opacity=".85"/>
  <use href="#txt" transform="translate(127,108)" stroke="#4a2810"/>
</svg>
